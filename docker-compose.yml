services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestio
      POSTGRES_USER: gestio
      POSTGRES_PASSWORD: gestio
    ports:
      - "5432:5432"
    volumes:
      - gestio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestio -d gestio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gestio-postgres:
